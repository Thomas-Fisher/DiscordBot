server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard's own files are compressed here (the .wasm and .dll files are large)
    gzip on;
    gzip_types application/javascript application/json application/wasm application/octet-stream text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # (expires, not add_header, for caching: a location with its own add_header would drop the security headers above)

    # The settings file is rewritten when the container starts, and index.html names the current files: both are checked every time
    location = /appsettings.json {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    # The framework files carry a hash in their name, so they can be kept for good
    location /_framework/ {
        expires 1y;
    }

    # Every other path (/guilds, /callback, ...) is a page inside the app, so hand it index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
